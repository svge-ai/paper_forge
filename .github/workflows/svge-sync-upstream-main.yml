# SVGE-only workflow. Keep this file on svge-main.
# GitHub reads schedule and workflow_dispatch from the default branch.
# Canonical main must stay a pristine upstream mirror, so this file does not
# belong on main. The default branch has to be svge-main before a schedule
# or a manual run can see this workflow. The job itself updates only
# refs/heads/main.

name: Sync upstream main

on:
  schedule:
    # 07:17 UTC daily. Avoids the top of the hour, when scheduled runs are
    # most often delayed or dropped.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check only; do not push"
        required: false
        type: boolean
        default: false

# contents: write is the narrowest Actions permission that can move a ref.
# GitHub does not scope it to one branch. The script refuses every push
# except HEAD:refs/heads/main. No pull-request, secret, or id-token access.
permissions:
  contents: write

concurrency:
  group: svge-sync-upstream-main
  cancel-in-progress: false

jobs:
  sync-main:
    name: Fast-forward canonical main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse any workflow ref other than svge-main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "svge-ai/paper_forge" ] || [ "$GITHUB_REF" != "refs/heads/svge-main" ]; then
            echo "::error::Refusing to run from ${GITHUB_REPOSITORY} ${GITHUB_REF}. This workflow runs from refs/heads/svge-main only."
            exit 1
          fi

      # No `uses:` action. The organization allows inline steps or
      # svge-ai-owned actions only, and any action ref must be a full SHA.
      # actions/checkout is owned by the actions organization. svge-ai/checkout
      # is a fork of that action and is not used. This step fetches the exact
      # triggering commit with anonymous git and stores no credentials.
      - name: Fetch the sync script at the triggering commit
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_WORKSPACE}" ] || [ "${GITHUB_WORKSPACE}" = "/" ]; then
            echo "::error::Refusing to initialize ${GITHUB_WORKSPACE:-<empty>}"
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GITHUB_SHA is not a 40-character commit SHA"
            exit 1
          fi
          empty_gitconfig="$(mktemp)"
          export GIT_CONFIG_GLOBAL="$empty_gitconfig"
          cd "${GITHUB_WORKSPACE}"
          rm -rf .git
          git init --quiet .
          git remote add origin https://github.com/svge-ai/paper_forge.git
          git fetch --depth 1 --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Fetched ${head_sha}, expected ${GITHUB_SHA}"
            exit 1
          fi
          test -f .github/scripts/svge-sync-upstream-main.sh
          if git config --show-origin --get-regexp '^(credential|http|url)\.' >/dev/null 2>&1; then
            echo "::error::Git credentials or URL rewrites were configured during fetch"
            exit 1
          fi

      - name: Fast-forward main from Manuel1471/paper_forge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: bash .github/scripts/svge-sync-upstream-main.sh
